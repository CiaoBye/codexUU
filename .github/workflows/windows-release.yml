name: Windows Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, commit, or tag)"
        required: true
        default: "main"
        type: string
      publish_release:
        description: "Publish GitHub Release after build"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, e.g. v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Check frontend types
        run: pnpm run typecheck

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Check Rust warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Write-Output "Building CodexUU v$version"
          pnpm tauri build

      - name: Collect build artifacts
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $bundleDir = "src-tauri/target/release/bundle"
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # Copy MSI if exists
          if (Test-Path "$bundleDir/msi") {
            Copy-Item "$bundleDir/msi/*.msi" $outDir -Force
          }
          # Copy NSIS installer if exists
          if (Test-Path "$bundleDir/nsis") {
            Copy-Item "$bundleDir/nsis/*.exe" $outDir -Force
          }
          # Generate SHA256 checksums
          Get-ChildItem $outDir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
          Get-ChildItem $outDir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexUU-windows-build
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Validate release inputs
        if: inputs.publish_release
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.release_tag }}")) {
            throw "release_tag is required when publishing a release."
          }

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.ref }}
          generate_release_notes: true
          files: release-artifacts/*
