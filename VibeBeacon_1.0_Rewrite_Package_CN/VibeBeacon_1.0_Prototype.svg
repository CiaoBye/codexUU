<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#090d15"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182234"/>
      <stop offset="1" stop-color="#121a28"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#826ef6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#23304b" flood-opacity="0.20"/>
    </filter>
    <style>
      text { font-family: 'Noto Sans CJK SC','Microsoft YaHei UI','Segoe UI',sans-serif; }
      .title { font-size: 40px; font-weight: 750; fill:#111827; }
      .subtitle { font-size: 20px; fill:#526174; }
      .section { font-size: 22px; font-weight: 700; fill:#1f2937; }
      .appTitle { font-size: 22px; font-weight:700; fill:#f8fafc; }
      .nav { font-size: 15px; fill:#a5b3c7; }
      .navActive { font-size: 15px; font-weight:700; fill:#ffffff; }
      .cardLabel { font-size: 14px; fill:#9eabc0; }
      .cardValue { font-size: 31px; font-weight:750; fill:#f8fafc; }
      .smallValue { font-size: 18px; font-weight:700; fill:#f8fafc; }
      .muted { font-size: 12px; fill:#718096; }
      .tiny { font-size: 11px; fill:#8492a8; }
      .green { fill:#42c98b; }
      .blue { fill:#4f95ff; }
      .purple { fill:#8a72f6; }
      .orange { fill:#e9a13c; }
      .white { fill:#f8fafc; }
      .line { stroke:#263247; stroke-width:1; }
