  <text x="688" y="801" class="tiny">Session 索引</text><circle cx="1039" cy="797" r="5" fill="#42c98b"/><text x="1050" y="801" class="tiny green">正常</text>
  <text x="688" y="830" class="tiny">供应商余额</text><circle cx="1039" cy="826" r="5" fill="#e7a948"/><text x="1050" y="830" class="tiny orange">降级</text>

