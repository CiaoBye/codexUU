[package]
name = "codexuu"
version = "1.3.21"
description = "CodexUU - Local AI Coding Activity & Quota Console for Windows"
authors = ["CodexUU Team"]
edition = "2021"

[lib]
name = "codexuu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep the Windows executable focused on distribution size. Tauri still ships
# the WebView2 runtime separately when required, so this only affects the
# native Rust side of the application.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled", "chrono", "blob"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
